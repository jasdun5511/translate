<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能点词阅读器 - Gemma 4 增强版</title>
    <style>
        :root { --primary: #2ecc71; --bg: #f8f9fa; --card: #ffffff; --text: #2c3e50; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { max-width: 650px; width: 100%; background: var(--card); min-height: 100vh; padding: 25px; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .view { display: none; flex-direction: column; }
        .view.active { display: flex; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; font-size: 14px; color: #7f8c8d; }
        input, select, textarea { padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        textarea { height: 200px; line-height: 1.6; }
        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .reader-area { line-height: 1.9; font-size: 20px; white-space: pre-wrap; color: #1a1a1a; }
        .word { cursor: pointer; border-radius: 4px; padding: 0 2px; display: inline-block; transition: 0.2s; }
        .word:hover { background: rgba(46, 204, 113, 0.2); color: var(--primary); }
        .word.active { background: var(--primary); color: white; }
        .dict-popup { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 650px; background: white; box-shadow: 0 -5px 30px rgba(0,0,0,0.15); border-radius: 20px 20px 0 0; transition: 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); padding: 25px; z-index: 1000; box-sizing: border-box; }
        .dict-popup.show { bottom: 0; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .popup-word { font-size: 24px; font-weight: bold; color: var(--primary); }
        .popup-body { font-size: 17px; line-height: 1.6; color: #34495e; }
        .loading { font-style: italic; color: #95a5a6; }
    </style>
</head>
<body>
<div class="container">
    <div id="setupView" class="view active">
        <h2 style="text-align:center;">AI 智能查词阅读器</h2>
        <div class="form-group">
            <label>1. API Key (Gemini/Gemma 通用)</label>
            <input type="password" id="apiKey" placeholder="输入您的密钥...">
        </div>
        <div class="form-group">
            <label>2. 核心 AI 模型 (重点选择)</label>
            <select id="aiModel">
                <option value="gemma-4-31b-it">Gemma 4 (31B 旗舰开源模型 - 推荐)</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (极速翻译)</option>
                <option value="gemma-4-26b-a4b-it">Gemma 4 (26B MoE 专家模型)</option>
            </select>
        </div>
        <div class="form-group">
            <label>3. 目标语言</label>
            <select id="targetLang">
                <option value="中文">中文 (Chinese)</option>
                <option value="葡萄牙语">Português (葡萄牙语)</option>
                <option value="英语">English (英语)</option>
            </select>
        </div>
        <div class="form-group">
            <label>4. 导入内容</label>
            <input type="file" id="fileInput" accept=".txt">
            <textarea id="textInput" placeholder="在此粘贴您的文章..."></textarea>
        </div>
        <button class="btn" onclick="startReading()">进入沉浸模式</button>
    </div>
    <div id="readerView" class="view">
        <button onclick="location.reload()" style="background:none; border:none; color:#7f8c8d; cursor:pointer; margin-bottom:15px;">← 返回修改</button>
        <div id="readerArea" class="reader-area"></div>
    </div>
</div>

<div id="dictPopup" class="dict-popup">
    <div class="popup-header">
        <span id="popupWord" class="popup-word"></span>
        <button onclick="closePopup()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#ccc;">×</button>
    </div>
    <div id="popupBody" class="popup-body"></div>
</div>

<script>
    // 文件导入
    document.getElementById('fileInput').addEventListener('change', e => {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('textInput').value = ev.target.result;
        reader.readAsText(e.target.files[0]);
    });

    function startReading() {
        const text = document.getElementById('textInput').value;
        if(!text.trim()) return alert("请先输入内容！");
        const area = document.getElementById('readerArea');
        area.innerHTML = '';
        // 渲染单词
        text.split(/(\b[a-zA-Z0-9'-]+\b)/g).forEach(t => {
            if(/\b[a-zA-Z0-9'-]+\b/.test(t)) {
                const s = document.createElement('span');
                s.className = 'word'; s.textContent = t;
                s.onclick = (e) => handleWord(e, t);
                area.appendChild(s);
            } else area.appendChild(document.createTextNode(t));
        });
        document.getElementById('setupView').classList.remove('active');
        document.getElementById('readerView').classList.add('active');
    }

    async function handleWord(e, word) {
        document.querySelectorAll('.word').forEach(w => w.classList.remove('active'));
        e.target.classList.add('active');
        const context = e.target.parentNode.textContent;
        const popup = document.getElementById('dictPopup');
        document.getElementById('popupWord').textContent = word;
        document.getElementById('popupBody').innerHTML = '<span class="loading">正在调用 AI 分析语境...</span>';
        popup.classList.add('show');

        const key = document.getElementById('apiKey').value;
        const model = document.getElementById('aiModel').value;
        const lang = document.getElementById('targetLang').value;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `作为查词助手，翻译单词"${word}"。上下文:"${context}"。目标语言:${lang}。格式:[音标] 意思 (提示)` }] }] })
            });
            const data = await res.json();
            document.getElementById('popupBody').innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
        } catch (err) { document.getElementById('popupBody').textContent = "请求错误，请检查 Key 或模型权限。"; }
    }

    function closePopup() { document.getElementById('dictPopup').classList.remove('show'); }
</script>
</body>
</html>
